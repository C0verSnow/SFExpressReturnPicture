<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>退货退款详情 · 收件信息编辑</title>
<style>
@font-face{font-family:Address;src:url(data:font/otf;base64,@@FONT@@) format('opentype')}
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Address,sans-serif}
#page{position:relative;width:1182px;height:2560px;margin:0;overflow:hidden}
#source{display:block;width:1182px;height:2560px}
#edit-address{position:absolute;left:82px;top:1636px;width:1018px;height:469px;border:0;background:transparent;cursor:pointer}
#edit-address:focus-visible{outline:3px solid #3589d6;outline-offset:-4px}
#rendered-photo{position:absolute;inset:0;width:1182px;height:2560px;pointer-events:none}
#rendered-photo[hidden]{display:none}
#tools{padding:20px;font:16px/1.7 sans-serif;max-width:1182px}#tools button{padding:10px 16px;margin-right:12px}
dialog{max-height:calc(100% - 32px);overflow:auto;border:0;border-radius:18px;width:min(560px,calc(100% - 32px));padding:28px;box-shadow:0 12px 60px #0003;font:16px/1.6 sans-serif}
dialog::backdrop{background:#0006}h1{margin:0 0 8px;font-size:24px}label{display:block;margin-top:16px}input{display:block;width:100%;padding:10px 12px;margin-top:6px;font:16px sans-serif;border:1px solid #bbb;border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:12px;margin-top:8px;font:16px/1.8 sans-serif;border:1px solid #bbb;border-radius:8px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.actions button{border:1px solid #ddd;border-radius:8px;padding:10px 22px;font:16px sans-serif;cursor:pointer}#confirm{background:#e72d20;color:white;border:0}#error{color:#bc241a;min-height:24px}#hint{color:#666;margin:0}details{padding:20px}
@media print{#tools,#license,dialog{display:none}}
</style></head><body>
<main id="page" aria-label="退货退款详情截图">
<img id="source" src="data:image/png;base64,@@PHOTO@@" alt="退货退款详情，点击商家地址区可以更改名字、电话和地址" width="1182" height="2560">
<button id="edit-address" type="button" aria-label="修改名字、电话和地址" aria-haspopup="dialog"></button>
<canvas id="rendered-photo" width="1182" height="2560" hidden role="img" aria-label="修改后的退货截图"></canvas>
</main>
<aside id="tools">点击灰色地址区修改名字、电话和地址，确认后自动下载整张 PNG 照片。<br>
<button id="save-photo" type="button">保存修改后的照片</button><button id="save" type="button">保存修改后的网页</button><button id="save-json" type="button">导出地址配置</button><span id="status" role="status"></span></aside>
<dialog id="editor" aria-labelledby="dialog-title" aria-describedby="hint">
<form id="address-form"><h1 id="dialog-title">修改名字、电话和地址</h1><p id="hint">保持原图字号、颜色和位置。地址最多三行，文字过长请缩短或换行。</p>
<label for="merchant-input">名字</label><input id="merchant-input" type="text" required aria-describedby="error" autocomplete="off">
<label for="phone-input">电话</label><input id="phone-input" type="tel" required aria-describedby="error" autocomplete="off">
<label for="address-input">新地址</label><textarea id="address-input" required aria-describedby="error"></textarea>
<div id="error" role="alert"></div><div class="actions"><button id="cancel" type="button">取消</button><button id="confirm" type="submit">确认修改</button></div></form></dialog>
<details id="license"><summary>字体许可</summary><pre>@@LICENSE@@</pre></details>
<script id="address-state" type="application/json">@@STATE@@</script><script>@@SCRIPT@@</script></body></html>
