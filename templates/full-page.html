<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>退货退款详情 · 地址编辑</title>
<style>
@font-face{font-family:Address;src:url(data:font/otf;base64,@@FONT@@) format('opentype')}
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Address,sans-serif}
#page{position:relative;width:1182px;height:2560px;margin:0;overflow:hidden}
#source{display:block;width:1182px;height:2560px}
#edit-address{position:absolute;left:82px;top:1636px;width:1018px;height:469px;border:0;background:transparent;cursor:pointer}
#edit-address:focus-visible{outline:3px solid #3589d6;outline-offset:-4px}
#replacement{position:absolute;left:126px;top:1800px;width:938px;height:246px;background:#f6f6f6;pointer-events:none;padding:2px 6px 0;color:#5d5d5d;font:400 48px/76px Address,sans-serif;letter-spacing:-.5px;white-space:pre;overflow:hidden}
#replacement[hidden]{display:none}#replacement span{display:block;height:76px}
#tools{padding:20px;font:16px/1.7 sans-serif;max-width:1182px}#tools button{padding:10px 16px;margin-right:12px}
dialog{border:0;border-radius:18px;width:min(560px,calc(100% - 32px));padding:28px;box-shadow:0 12px 60px #0003;font:16px/1.6 sans-serif}
dialog::backdrop{background:#0006}h1{margin:0 0 8px;font-size:24px}label{display:block;margin-top:20px}textarea{display:block;width:100%;min-height:150px;padding:12px;margin-top:8px;font:16px/1.8 sans-serif;border:1px solid #bbb;border-radius:8px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.actions button{border:1px solid #ddd;border-radius:8px;padding:10px 22px;font:16px sans-serif;cursor:pointer}#confirm{background:#e72d20;color:white;border:0}#error{color:#bc241a;min-height:24px}#hint{color:#666;margin:0}details{padding:20px}
@media print{#tools,#license,dialog{display:none}}
</style></head><body>
<main id="page" aria-label="退货退款详情截图">
<img id="source" src="data:image/jpeg;base64,@@PHOTO@@" alt="退货退款详情，点击商家地址区可以更改地址" width="1182" height="2560">
<button id="edit-address" type="button" aria-label="修改地址" aria-haspopup="dialog"></button>
<div id="replacement" hidden aria-label="修改后的地址"><span></span><span></span><span></span></div>
</main>
<aside id="tools">点击灰色地址区，在弹窗内输入新地址。商家和电话保持原样。<br>
<button id="save" type="button">保存修改后的网页</button><button id="save-json" type="button">导出地址配置</button><span id="status" role="status"></span></aside>
<dialog id="editor" aria-labelledby="dialog-title" aria-describedby="hint">
<form id="address-form"><h1 id="dialog-title">修改退货地址</h1><p id="hint">只修改下方地址，商家名称和电话保持原样。最多三行，每行以实际显示宽度为准。</p>
<label for="address-input">新地址</label><textarea id="address-input" required aria-describedby="error" autofocus></textarea>
<div id="error" role="alert"></div><div class="actions"><button id="cancel" type="button">取消</button><button id="confirm" type="submit">确认修改</button></div></form></dialog>
<details id="license"><summary>字体许可</summary><pre>@@LICENSE@@</pre></details>
<script id="address-state" type="application/json">@@STATE@@</script><script>@@SCRIPT@@</script></body></html>
