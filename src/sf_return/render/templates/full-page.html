<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<title>退货退款详情 · 收件信息编辑</title>
<style>
@font-face{font-family:Address;src:url(data:font/otf;base64,@@FONT@@) format('opentype')}
/* Chrome automatic darkening must not recolor the source, preview or photo editor.
   See https://developer.chrome.com/blog/auto-dark-theme#how_to_opt_out_of_auto_dark_theme */
:root{color-scheme:only light;--preview-width:420px;--accent:#e94335}
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#252832;font-family:system-ui,-apple-system,sans-serif}
#workspace{width:min(100%,var(--preview-width));margin:auto;padding:20px 12px 0}
#page{position:relative;width:100%;aspect-ratio:1182/2560;overflow:hidden;border-radius:18px;box-shadow:0 8px 32px #20293812;background:white}
#source{display:none}#rendered-photo{display:block;width:100%;height:100%;position:absolute;inset:0;pointer-events:none}#rendered-photo[hidden]{display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#666b77}#loading[hidden]{display:none}
#edit-address{position:absolute;z-index:1;left:6.9374%;top:63.90625%;width:86.1252%;height:18.320313%;border:0;border-radius:12px;background:transparent;cursor:pointer}
#edit-address span{position:absolute;right:3%;top:2%;display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:20px;background:#fff;color:#b93228;font:600 10px system-ui;box-shadow:0 2px 8px #0001}
#edit-address svg{width:12px;height:12px}
#edit-address:hover{background:#e9433508}#edit-address:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#edit-address:disabled,#save-photo:disabled{cursor:wait;opacity:.6}svg{width:20px;height:20px;flex-shrink:0}
#tools{position:sticky;bottom:0;z-index:2;background:#f4f5f7ee;backdrop-filter:blur(12px);padding:16px 0 max(16px,env(safe-area-inset-bottom));text-align:center}
#tools p{margin:0 0 12px;color:#666b77;font-size:13px;line-height:1.7}
#save-photo{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:0;border-radius:15px;background:var(--accent);color:white;font:600 16px system-ui;box-shadow:0 6px 16px #e9433526;cursor:pointer;transition:background .15s,transform .15s}
#save-photo:hover{background:#d73529}#save-photo:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #247cbb;outline-offset:3px}
#status{display:block;margin-top:8px;font-size:12px;line-height:1.6;color:#59616e}#status:empty{display:none}
dialog{max-height:calc(100dvh - 32px);overflow:auto;border:0;border-radius:20px;width:min(520px,calc(100% - 32px));padding:26px;background:#fff;color:#252832;box-shadow:0 12px 60px #0003;font:16px/1.6 system-ui}
dialog::backdrop{background:#18202b66}h1{margin:0 0 8px;font-size:22px}label{display:block;margin-top:16px;font-weight:600}input,textarea{display:block;width:100%;padding:12px;margin-top:6px;font:16px/1.7 system-ui;border:1px solid #d9dce2;border-radius:10px;background:#fafbfc;color:#252832;caret-color:#252832}input::placeholder,textarea::placeholder{color:#666b77;opacity:1}textarea{min-height:132px;resize:vertical}
.actions{display:flex;gap:12px;margin-top:20px}.actions button{flex:1;border:1px solid #ddd;border-radius:12px;min-height:48px;padding:10px;font:600 16px system-ui;cursor:pointer}#confirm{background:var(--accent);color:white;border:0}#parse-status{font-size:14px;color:#356b45}#parse-address{margin-top:8px;padding:10px 16px;border:1px solid #d9dce2;border-radius:10px;background:white;font:600 14px system-ui;cursor:pointer}#error{color:#bc241a;min-height:24px}#hint{color:#666b77;margin:0;font-size:14px}
html[data-platform="laptop"]{--preview-width:380px}html[data-platform="tablet"]{--preview-width:480px}html[data-platform="mobile"]{--preview-width:100%}
@media(max-width:599px){#workspace{padding:10px 10px 0}#page{border-radius:14px}dialog{padding:20px}#tools{padding-top:12px}}
@media print{#tools,#edit-address,dialog{display:none}#workspace{width:100%;padding:0}#page{box-shadow:none;border-radius:0}}
</style></head><body>
<div id="workspace"><main id="page" aria-label="退货退款详情截图">
<span id="loading" role="status">正在准备收件信息预览…</span>
<img id="source" aria-hidden="true" src="data:image/png;base64,@@PHOTO@@" alt="退货退款详情，点击修改信息按钮更改名字、电话和地址" width="1182" height="2560">
<button id="edit-address" type="button" aria-label="修改名字、电话和地址" aria-haspopup="dialog" disabled><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a3 3 0 0 0-4-4L4 15v5Z"/></svg>修改信息</span></button>
<canvas id="rendered-photo" width="1182" height="2560" hidden role="img" aria-label="修改后的退货截图"></canvas>
</main>
<aside id="tools"><p>点击按钮即可修改信息，注意地址要写满三行</p>
<button id="save-photo" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>保存修改后的照片</button><span id="status" role="status"></span></aside></div>
<dialog id="editor" aria-labelledby="dialog-title" aria-describedby="hint">
<form id="address-form"><h1 id="dialog-title">修改收件信息</h1><p id="hint">地址请写满三行，每行都要填写。照片保持原始尺寸。</p>
<label for="paste-input">粘贴完整收件信息</label><textarea id="paste-input" maxlength="2000" aria-describedby="parse-status error" placeholder="张三 18888888888&#10;广东省深圳市南山区人才公园"></textarea><button id="parse-address" type="button">粘贴并解析</button><p id="parse-status" role="status"></p>
<label for="merchant-input">名字</label><input id="merchant-input" type="text" required aria-describedby="error" autocomplete="off">
<label for="phone-input">电话</label><input id="phone-input" type="tel" required aria-describedby="error" autocomplete="off">
<label for="address-input">地址（共三行）</label><textarea id="address-input" required aria-describedby="error"></textarea>
<div id="error" role="alert"></div><div class="actions"><button id="cancel" type="button">取消</button><button id="confirm" type="submit">确认修改</button></div></form></dialog>
<script id="region-license" type="text/plain">@@REGION_LICENSE@@</script>
<script id="region-data" type="application/json">@@REGIONS@@</script>
<script id="address-state" type="application/json">@@STATE@@</script><script>@@SCRIPT@@</script></body></html>
