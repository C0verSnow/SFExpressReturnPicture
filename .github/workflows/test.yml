name: Screenshot tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python workflow.py split --output-dir sample-output
      - uses: actions/upload-artifact@v4
        with:
          name: sample-pngs-python-${{ matrix.python }}
          path: sample-output/*.png
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt playwright==1.55.0
      - run: playwright install --with-deps chromium
      - name: Generate once and verify HTTP, offline and responsive flows
        run: python workflow.py verify
      - name: Check committed deployment files match remote generation
        run: |
          if [ -f pages/index.html ]; then
            diff -qr pages pages-site
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site
          path: pages-site/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: |
            pages-check/
            offline-return-page/
            offline-address/
          if-no-files-found: error
